services:
  generador:
    build: .
    container_name: generador_libros
    ports:
      - "5000:5000"
    volumes:
      - ./books:/app/books
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - WEB_HOST=0.0.0.0
    restart: unless-stopped
    tty: true
    # CLI example: docker compose run --rm generador python src/app.py --language es
